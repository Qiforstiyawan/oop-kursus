name: Autograding Tests

on:
  push:
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Bagian 1 Main Output Test
        id: test-p01mainoutputtest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 1 Main Output Test
          command: mvn -q test -Dtest=P01MainOutputTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Bagian 2 Instructor Test
        id: test-p02instructortest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 2 Instructor Test
          command: mvn -q test -Dtest=P02InstructorTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Bagian 2 Online Course Test
        id: test-p02onlinecoursetest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 2 Online Course Test
          command: mvn -q test -Dtest=P02OnlineCourseTest -DfailIfNoTests=true
          timeout: 10
          max-score: 10

      - name: Bagian 3 Encapsulation Test
        id: test-p03encapsulationtest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 3 Encapsulation Test
          command: mvn -q test -Dtest=P03EncapsulationTest -DfailIfNoTests=true
          timeout: 10
          max-score: 10

      - name: Bagian 3 Student Test
        id: test-p03studenttest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 3 Student Test
          command: mvn -q test -Dtest=P03StudentTest -DfailIfNoTests=true
          timeout: 10
          max-score: 10

      - name: Bagian 4 Association Test
        id: test-p04associationtest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 4 Association Test
          command: mvn -q test -Dtest=P04AssociationTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Bagian 4 Classroom Aggregation Test
        id: test-p04classroomaggregationtest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 4 Classroom Aggregation Test
          command: mvn -q test -Dtest=P04ClassroomAggregationTest -DfailIfNoTests=true
          timeout: 10
          max-score: 10

      - name: Bagian 4 Composition Test
        id: test-p04studentcardcompositiontest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 4 Composition Test
          command: mvn -q test -Dtest=P04StudentCardCompositionTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Bagian 4 Dependency Test
        id: test-p04registrardependencytest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 4 Dependency Test
          command: mvn -q test -Dtest=P04RegistrarDependencyTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Bagian 5 Inheritance Test
        id: test-p06inheritancetest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 5 Inheritance Test
          command: mvn -q test -Dtest=P06InheritanceTest -DfailIfNoTests=true
          timeout: 10
          max-score: 10

      - name: Bagian 6 Overriding Test
        id: test-p07overridetest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 6 Overriding Test
          command: mvn -q test -Dtest=P07OverrideTest -DfailIfNoTests=true
          timeout: 10
          max-score: 10

      - name: Bagian 6 Overloading Test
        id: test-p07overloadtest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 6 Overloading Test
          command: mvn -q test -Dtest=P07OverloadTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Bagian 7 Academy Test
        id: test-p08academytest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 7 Academy Test
          command: mvn -q test -Dtest=P08AcademyTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Bagian 7 Console App Test
        id: test-p08academyapptest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 7 Console App Test
          command: mvn -q test -Dtest=P08AcademyAppTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          TEST-P01MAINOUTPUTTEST_RESULTS: "${{ steps.test-p01mainoutputtest.outputs.result }}"
          TEST-P02INSTRUCTORTEST_RESULTS: "${{ steps.test-p02instructortest.outputs.result }}"
          TEST-P02ONLINECOURSETEST_RESULTS: "${{ steps.test-p02onlinecoursetest.outputs.result }}"
          TEST-P03ENCAPSULATIONTEST_RESULTS: "${{ steps.test-p03encapsulationtest.outputs.result }}"
          TEST-P03STUDENTTEST_RESULTS: "${{ steps.test-p03studenttest.outputs.result }}"
          TEST-P04ASSOCIATIONTEST_RESULTS: "${{ steps.test-p04associationtest.outputs.result }}"
          TEST-P04CLASSROOMAGGREGATIONTEST_RESULTS: "${{ steps.test-p04classroomaggregationtest.outputs.result }}"
          TEST-P04STUDENTCARDCOMPOSITIONTEST_RESULTS: "${{ steps.test-p04studentcardcompositiontest.outputs.result }}"
          TEST-P04REGISTRARDEPENDENCYTEST_RESULTS: "${{ steps.test-p04registrardependencytest.outputs.result }}"
          TEST-P06INHERITANCETEST_RESULTS: "${{ steps.test-p06inheritancetest.outputs.result }}"
          TEST-P07OVERRIDETEST_RESULTS: "${{ steps.test-p07overridetest.outputs.result }}"
          TEST-P07OVERLOADTEST_RESULTS: "${{ steps.test-p07overloadtest.outputs.result }}"
          TEST-P08ACADEMYTEST_RESULTS: "${{ steps.test-p08academytest.outputs.result }}"
          TEST-P08ACADEMYAPPTEST_RESULTS: "${{ steps.test-p08academyapptest.outputs.result }}"
        with:
          runners: test-p01mainoutputtest,test-p02instructortest,test-p02onlinecoursetest,test-p03encapsulationtest,test-p03studenttest,test-p04associationtest,test-p04classroomaggregationtest,test-p04studentcardcompositiontest,test-p04registrardependencytest,test-p06inheritancetest,test-p07overridetest,test-p07overloadtest,test-p08academytest,test-p08academyapptest
